name: Deploy web
# On main: build one image and deploy it to staging. To release: run the
# "Release" workflow, which calls this one with the image tag (commit SHA) staging runs.
on:
  workflow_call:
    inputs:
      promote_image:
        description: Image tag (full commit SHA) already on staging to release to production. Empty = build and deploy staging.
        required: false
        type: string
        default: ""
  workflow_dispatch: # by hand: rebuild main and redeploy staging
permissions:
  contents: read
env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  STAGING_APP: spaced-rep-web-staging
  PRODUCTION_APP: spaced-rep-web
jobs:
  staging:
    if: inputs.promote_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency: { group: deploy-web-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Build the image once and push it
        run: |
          flyctl deploy . --app "$STAGING_APP" --config apps/web/fly.toml \
            --build-only --push --image-label "$GITHUB_SHA" --remote-only
      - name: Deploy to staging
        env:
          WEB_API_SECRET: ${{ secrets.WEB_API_SECRET }}
        run: |
          flyctl secrets set --app "$STAGING_APP" --stage API_URL="https://spaced-rep-api-staging.fly.dev" WEB_API_SECRET="$WEB_API_SECRET"
          flyctl deploy --app "$STAGING_APP" --config apps/web/fly.toml \
            --image "registry.fly.io/$STAGING_APP:$GITHUB_SHA"
      - name: Health check
        run: curl --fail --silent --output /dev/null --retry 10 --retry-delay 6 --retry-all-errors "https://$STAGING_APP.fly.dev"
      - name: How to release
        run: echo "Staging now runs \`${GITHUB_SHA::7}\`. To release it, run the **Release** workflow." >> "$GITHUB_STEP_SUMMARY"

  production:
    if: inputs.promote_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency: { group: deploy-web-production, cancel-in-progress: false }
    env:
      IMAGE_TAG: ${{ inputs.promote_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Deploy the staging image to production
        env:
          WEB_API_SECRET: ${{ secrets.WEB_API_SECRET }}
        run: |
          flyctl secrets set --app "$PRODUCTION_APP" --stage API_URL="https://spaced-rep-api.fly.dev" WEB_API_SECRET="$WEB_API_SECRET"
          flyctl deploy --app "$PRODUCTION_APP" --config apps/web/fly.toml \
            --image "registry.fly.io/$STAGING_APP:$IMAGE_TAG"
      - name: Health check
        run: curl --fail --silent --output /dev/null --retry 10 --retry-delay 6 --retry-all-errors "https://$PRODUCTION_APP.fly.dev"
