name: Release
# The one button for production. It releases what staging is running: the api
# and web images staging tested. Nothing is rebuilt.
# Order: api, then web, because the web app calls the api.
# Rollback: give the commit to go back to and tick "allow older".
on:
  workflow_dispatch:
    inputs:
      api:
        description: Release the api
        type: boolean
        default: true
      web:
        description: Release the web app
        type: boolean
        default: true
      commit:
        description: "Rollback, api and web only: full commit SHA to release. Empty = what staging runs now."
        required: false
        type: string
        default: ""
      allow_older:
        description: Rollback, allow a commit older than the one in production
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: release, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api_commit: ${{ steps.plan.outputs.api_commit }}
      web_commit: ${{ steps.plan.outputs.web_commit }}
    steps:
      - name: Releases start from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release was started from $GITHUB_REF_NAME. Start it from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the plan compares commits
          filter: blob:none
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Work out what to release
        id: plan
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          COMMIT: ${{ inputs.commit }}
          ALLOW_OLDER: ${{ inputs.allow_older }}
          RELEASE_API: ${{ inputs.api }}
          RELEASE_WEB: ${{ inputs.web }}
        run: .github/scripts/release-plan.sh

  # !failure() lets a job run when the one before it was unticked, and stops it when that one failed.
  api:
    needs: plan
    if: ${{ !failure() && !cancelled() && inputs.api }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-api.yml
    with:
      promote_image: ${{ needs.plan.outputs.api_commit }}
    secrets: inherit

  web:
    needs: [plan, api]
    if: ${{ !failure() && !cancelled() && inputs.web }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      promote_image: ${{ needs.plan.outputs.web_commit }}
    secrets: inherit
